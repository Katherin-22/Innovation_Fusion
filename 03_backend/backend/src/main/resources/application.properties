# Nombre de la aplicación
spring.application.name=backend

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/Innovation_Fusion
spring.datasource.username=root
spring.datasource.password=SENA

# Configuración de la estrategia de nombres físicos (mantener los nombres tal como están)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# No realizar cambios en el esquema de la base de datos (solo validación)
spring.jpa.hibernate.ddl-auto=validate

# Configuración del driver para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
